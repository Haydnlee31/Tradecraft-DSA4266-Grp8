name: Cross-platform core pipeline

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    # These are core/sequential tests, not Ray or GPU support claims.
    name: Python 3.12 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-baselines.txt
      - run: python -m pip install --upgrade pip
      # Include optional centralized XGBoost so its subprocess/reload test is
      # exercised on each OS, not silently skipped in the core-only install.
      - run: python -m pip install -r requirements-baselines.txt
      - run: python -m pip check
      - name: Import the complete study and explanation entry points
        run: python -c "import src.experiment; import src.explain.analyze; import src.eval.study"
      - run: python -m unittest discover -v

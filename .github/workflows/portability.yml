name: Cross-platform core pipeline

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    # These are core/sequential tests, not Ray or GPU support claims.
    name: Python 3.13 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      # Published documents are UTF-8, including uncertainty symbols. Avoid
      # Windows' locale-dependent default decoding in historical audit tools.
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Frozen source-audit receipts use Python 3.13's ast.dump format.
          # Earlier interpreters serialize empty AST fields differently. Run
          # the complete suite in its audited runtime; do not weaken the hashes.
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-baselines.txt
      # XGBoost's macOS wheel needs the native OpenMP runtime, which pip
      # cannot install. Linux and Windows wheels do not need this brew step.
      - name: Install macOS OpenMP runtime
        if: runner.os == 'macOS'
        run: brew install libomp
      # Hosted runners contain unrelated tools (such as pipx). Keep their
      # dependencies outside our environment instead of suppressing pip check.
      # GITHUB_PATH makes later steps AND Python subprocesses use this venv.
      - name: Create isolated CI environment
        shell: python
        run: |
          import os
          from pathlib import Path
          import venv

          environment = Path(os.environ["RUNNER_TEMP"]) / "tradecraft-ci-venv"
          venv.create(environment, with_pip=True)
          scripts = environment / ("Scripts" if os.name == "nt" else "bin")
          with open(os.environ["GITHUB_PATH"], "a", encoding="utf-8") as path_file:
              path_file.write(str(scripts) + "\n")
      - name: Verify environment isolation
        run: python -c "import sys; print(sys.executable); assert sys.prefix != sys.base_prefix, 'CI must use its isolated virtual environment'"
      - run: python -m pip install --upgrade pip
      # Include optional centralized XGBoost so its subprocess/reload test is
      # exercised on each OS, not silently skipped in the core-only install.
      - run: python -m pip install -r requirements-baselines.txt
      - run: python -m pip check
      - name: Import the complete study and explanation entry points
        run: python -c "import src.experiment; import src.explain.analyze; import src.eval.study"
      - run: python -m unittest discover -v
      # Retired experiments retain their tests in a disposable old-path view.
      # No private datasets, checkpoints, optional Laya runtime or GPU needed.
      - name: Verify archive and run historical regression tests
        run: python scripts/archive_tools.py test

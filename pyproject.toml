[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tradecraft-dsa4266"
version = "0.1.0"
description = "Centralized and federated IoT intrusion classification on CICIoT2023"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = [
    "flwr[simulation]>=1.36,<1.40",
    "torch>=2.2",
    "polars>=1.0",
    "pyarrow>=15.0",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "numpy>=1.26"
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.flwr.app]
publisher = "Tradecraft-DSA4266-Grp8"
fab-format-version = 1
flwr-version-target = "1.36.0"

[tool.flwr.app.components]
serverapp = "src.federated.server_app:app"
clientapp = "src.federated.client_app:app"

[tool.flwr.app.config]
num-server-rounds = 25
seed = 0
patience = 5
# 1.0 = every client trains every round, so 1 round x 1 local epoch ~ one pass over
# train -- keeps the round budget comparable to centralized-light's epochs
fraction-train = 1.0
# 0 = no client-side eval; the server's full-val eval is the val result that counts
fraction-evaluate = 0.0
# Optional client learning-rate schedule. 0 disables it so the default uses a
# constant Adam learning rate, matching centralized-light.
lr-decay-every = 0
lr-decay-factor = 0.5
# Train split across clients: "dirichlet" (non-IID by class, mapping from
# src/federated/partition.py) or "iid" (every N-th row; the IID baseline)
partitioner = "dirichlet"
dirichlet-alpha = 0.5
# Explicit mapping path; empty = <splits-dir>/../partitions/dirichlet_a{alpha}_n{N}_s{seed}.parquet
partition-file = ""
loss = "sqrt_weighted_ce"
# Loss class weights from "global" (whole train split; matches centralized) or
# "local" (each client's own counts, floored at 1)
class-weights = "global"
local-epochs = 1
learning-rate = 0.001
batch-size = 64
save-model = false
splits-dir = ""
output-dir = ""
reports-dir = ""

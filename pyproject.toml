[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fed-ciciot"
version = "0.1.0"
description = "Federated learning simulation for IoT network intrusion detection on CICIoT2023"
license = {file = "LICENSE"}
dependencies = [
    "flwr[simulation]>=1.36.0",
    "flwr-datasets[vision]>=0.6.1",
    "torch==2.10.0",
    "torchvision==0.25.0",
    "wandb>=0.17.8",
    "polars>=1.0",
    "pyarrow>=15.0",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "numpy>=1.26"
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.flwr.app]
publisher = "Tradecraft-DSA4266-Grp8"
fab-format-version = 1
flwr-version-target = "1.36.0"

[tool.flwr.app.components]
serverapp = "src.federated.server_app:app"
clientapp = "src.federated.client_app:app"

[tool.flwr.app.config]
num-server-rounds = 25
seed = 0
patience = 5
# 1.0 = every client trains every round, so 1 round x 1 local epoch ~ one pass over
# train -- keeps the round budget comparable to centralized-light's epochs
fraction-train = 1.0
fraction-evaluate = 1.0
loss = "sqrt_weighted_ce"
# Loss class weights from "global" (whole train split; matches centralized) or
# "local" (each client's own counts, floored at 1)
class-weights = "global"
local-epochs = 1
learning-rate = 0.001
batch-size = 64
save-model = false
splits-dir = ""
output-dir = ""
reports-dir = ""
